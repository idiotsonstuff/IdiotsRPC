name: Build IdiotsRPC v3.1.0 EXE

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pypresence pyinstaller

      - name: Build EXE
        run: pyinstaller --onedir --name "IdiotsRPC" IdiotsRPC_v3.1.0.py

      - name: Upload EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IdiotsRPC-v3.1.0-Windows
          path: dist/IdiotsRPC/
